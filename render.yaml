# One-click deploy on Render (Blueprint). Secrets are entered in the Render dashboard, never committed.
services:
  - type: web
    name: redgreen
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PUBLIC_URL          # e.g. https://redgreen.onrender.com (set after the first deploy)
        sync: false
      - key: GEMINI_API_KEY      # optional: your Google AI Studio key; otherwise visitors add their own on the Model page
        sync: false
      - key: REDGREEN_PASSWORD   # optional: protect the whole site with a password
        sync: false
      - key: REDGREEN_ALLOW_REPO_CODE
        value: "1"               # GitHub mode (Reproduce + bot). Runs in Render's throwaway container; install scripts stay disabled, no secrets reach repo code
